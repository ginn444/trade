name: autotrader tests
on:
  push:
    paths: ["autotrader/**", ".github/workflows/autotrader-tests.yml"]
  pull_request:
    paths: ["autotrader/**", ".github/workflows/autotrader-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autotrader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock.txt && pip install --no-deps -e .
      - run: pytest
