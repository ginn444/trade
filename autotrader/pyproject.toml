[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "Autonomous AI-assisted stock & options trading bot (Alpaca + Claude) with a deterministic risk engine. Paper trading by default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.44,<1",
  "anthropic>=1.13,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
autotrader = "autotrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autotrader = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
